# Workflow de déploiement sur GitHub Pages (US-023) : build de production
# puis publication à chaque push sur main. L'application vit dans le
# sous-dossier DogAgilityCourseMakerPoc2.
# Prérequis (une seule fois, réglage manuel du dépôt) :
# Settings → Pages → Source « GitHub Actions ».
name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write
  # Deleting stale "github-pages" artifacts (cleanup step) requires actions:write
  actions: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Build et déploiement Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    defaults:
      run:
        working-directory: DogAgilityCourseMakerPoc2
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v7

      - name: Configurer Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: DogAgilityCourseMakerPoc2/package-lock.json

      - name: Installer les dépendances
        run: npm ci

      - name: Build de production (tsc -b + vite build)
        run: npm run build
        env:
          VITE_BASE: /DogAgilityCourseMakerPOC2/

      - name: Nettoyer les artefacts Pages des tentatives précédentes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for artifact_id in $(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts" --jq '.artifacts[] | select(.name == "github-pages") | .id'); do
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}"
          done

      - name: Préparer l'artefact Pages
        uses: actions/upload-pages-artifact@v5
        with:
          path: DogAgilityCourseMakerPoc2/dist

      - name: Déployer sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
